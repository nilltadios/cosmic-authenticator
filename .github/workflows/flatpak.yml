name: Build and publish Flatpak

# Every push to main builds, signs and publishes the Flatpak repository on
# GitHub Pages (same pattern as nilltadios/warehouse-cosmic). Add "[skip ci]"
# to a commit message to push without a release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authenticator-flatpak-pages
  cancel-in-progress: false

jobs:
  # The Flatpak build has no network: vendor the crates pinned by Cargo.lock
  # first, as flatpak/build.sh does locally.
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Vendor crates
        run: |
          version=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')
          rustup toolchain install "$version" --profile minimal
          cargo vendor --locked flatpak/vendor | sed "s|$PWD/flatpak/vendor|flatpak/vendor|" > flatpak/cargo-config.toml
          tar -cf vendor.tar flatpak/vendor flatpak/cargo-config.toml
      - uses: actions/upload-artifact@v7
        with:
          name: vendor
          path: vendor.tar
          retention-days: 1

  build:
    needs: vendor
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: vendor
      - run: tar -xf vendor.tar && rm vendor.tar
      - name: Import repository signing key
        id: signing
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          test -n "$GPG_PRIVATE_KEY" || { echo '::error::Set the GPG_PRIVATE_KEY repository secret.'; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/authenticator-signing"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          key=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1=="fpr" {print $10; exit}')
          test -n "$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .flatpak-builder
          key: flatpak-builder-gnome-51-${{ hashFiles('Cargo.lock', 'flatpak/dev.nilltadios.CosmicAuthenticator.yml') }}
          restore-keys: flatpak-builder-gnome-51-
      # Build into flatpak/build-dir and flatpak/repo: the manifest's source
      # (the checkout) skips those, so the output is not copied into the build.
      - name: Build and export signed repository
        env:
          KEY: ${{ steps.signing.outputs.key }}
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --default-branch=stable --gpg-sign="$KEY" --repo=flatpak/repo \
            flatpak/build-dir flatpak/dev.nilltadios.CosmicAuthenticator.yml
          flatpak build-update-repo --generate-static-deltas --title='COSMIC Authenticator' --gpg-sign="$KEY" flatpak/repo
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak/repo dev.nilltadios.CosmicAuthenticator.flatpak dev.nilltadios.CosmicAuthenticator stable
      - name: Prepare Pages install files
        env:
          KEY: ${{ steps.signing.outputs.key }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: |
          base="${PAGES_BASE_URL:-https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/}"
          python3 ci/publish.py flatpak/repo site "$base" "$KEY" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: cosmic-authenticator-x86_64
          path: dev.nilltadios.CosmicAuthenticator.flatpak
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
