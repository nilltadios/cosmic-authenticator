[package]
name = "cosmic-authenticator"
version = "0.3.1"
edition = "2024"
license = "GPL-3.0-only"
description = "Native COSMIC front end for Proton Authenticator's Rust core"

[workspace]
members = [".", "login"]
# The sign-in helper needs WebKitGTK's development files, so a plain
# `cargo build` builds only the app. `cargo build -p cosmic-authenticator-login`
# builds the helper where those files exist (the GNOME SDK, or webkitgtk6.0-devel).
default-members = ["."]

[features]
# GPU rendering. On by default: on the user's 2560x1440 monitor the software
# renderer idled at 6.1% CPU (64 MB) and lagged when scrolling and resizing,
# the GPU renderer at 0.2% (86 MB) and smooth (demo/measure.sh, 2026-09-25).
# `--no-default-features` builds the software renderer.
default = ["wgpu"]
wgpu = ["libcosmic/wgpu"]
# AUTHENTICATOR_PREVIEW=<view> opens a view at startup, for screenshots.
preview = []

[dependencies]
# `zeroize` wipes keys and Argon2's working memory when they are dropped.
aes-gcm = { version = "0.11", features = ["zeroize"] }
argon2 = { version = "0.6", features = ["zeroize"] }
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
# Account keys and the Authenticator key are OpenPGP (Proton sync).
pgp = "0.21"
# The system RNG, with the rand 0.8 traits pgp's message builder takes; also
# used for salts and IVs (aes-gcm 0.11 no longer re-exports one).
rand_core = { version = "0.6", features = ["getrandom"] }
keyring = "4.2"
# Proton's "qr" feature is left off: its QR reader, rxing, pins an older `image`
# than libcosmic accepts. rqrr reads QR codes instead.
proton-authenticator = { git = "https://github.com/protonpass/proton-pass-common.git", default-features = false }
rqrr = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
ureq = "3"
# Passwords and keys are wiped from memory when dropped (src/secret.rs).
zeroize = { version = "1", features = ["serde"] }
url = "2"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = ["single-instance", "xdg-portal"]

[profile.release]
lto = "thin"
strip = true
