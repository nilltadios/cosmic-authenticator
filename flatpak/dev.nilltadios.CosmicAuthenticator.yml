# Flatpak manifest. Build with flatpak/build.sh, which vendors the crates first:
# the build sandbox has no network, so every crate comes from flatpak/vendor.
id: dev.nilltadios.CosmicAuthenticator
# Freedesktop runtime: the app is pure Rust + libcosmic, and Proton sign-in
# opens the user's system browser through the OpenURI portal (no WebKitGTK or
# GNOME runtime needed).
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: cosmic-authenticator

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Service logos are downloaded from each service's site or Google's favicon service.
  - --share=network
  # The vault key lives in the Secret Service keyring.
  - --talk-name=org.freedesktop.secrets
  # libcosmic reads the COSMIC theme (accent colour, dark mode) from here.
  - --filesystem=xdg-config/cosmic:ro
  # Imports and exports go through the file chooser portal, so no file access is needed.

# Rust is a build tool, removed before export.
cleanup:
  - /lib/rust

modules:
  # The official Rust release pinned in rust-toolchain.toml, not the SDK's
  # rust-stable extension, whose 26.08 branch is still 1.98.0.
  # To update: change the version here and in rust-toolchain.toml, and take the
  # sha256 from the .sha256 file next to the archive on static.rust-lang.org.
  - name: rust-toolchain
    buildsystem: simple
    build-options:
      no-debuginfo: true
      strip: false
    build-commands:
      - ./install.sh --prefix=/app/lib/rust --components=rustc,cargo,rust-std-x86_64-unknown-linux-gnu --disable-ldconfig
    sources:
      - type: archive
        url: https://static.rust-lang.org/dist/rust-1.100.0-x86_64-unknown-linux-gnu.tar.xz
        sha256: 98ee6bec240e1cfe944f17e7092412dc5ef6e008484bb668c6936d35a7d15acd

  - name: cosmic-authenticator
    buildsystem: simple
    build-options:
      prepend-path: /app/lib/rust/bin
      env:
        CARGO_HOME: /run/build/cosmic-authenticator/cargo
    build-commands:
      - rustc --version && cargo --version
      - mkdir -p .cargo && cp flatpak/cargo-config.toml .cargo/config.toml
      # Cargo does not follow flatpak-builder's --jobs by itself; pass it on.
      - cargo --offline build --release --locked -j "${FLATPAK_BUILDER_N_JOBS:-4}"
      - install -Dm755 target/release/cosmic-authenticator /app/bin/cosmic-authenticator
      - install -Dm644 resources/dev.nilltadios.CosmicAuthenticator.desktop /app/share/applications/dev.nilltadios.CosmicAuthenticator.desktop
      - install -Dm644 resources/dev.nilltadios.CosmicAuthenticator.svg /app/share/icons/hicolor/scalable/apps/dev.nilltadios.CosmicAuthenticator.svg
      - cp -r resources/icons/CosmicAuthenticator /app/share/icons/
      - install -Dm644 resources/dev.nilltadios.CosmicAuthenticator.metainfo.xml /app/share/metainfo/dev.nilltadios.CosmicAuthenticator.metainfo.xml
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - vendor-ref
          - demo
          - demo-data
          - flatpak/build-dir
          - flatpak/repo
          - flatpak/.flatpak-builder
          - .flatpak-builder
          - .cargo
