[package]
name = "cosmic-authenticator-login"
version = "0.3.1"
edition = "2024"
license = "GPL-3.0-only"
description = "Proton sign-in window for cosmic-authenticator"

# Needs the WebKitGTK 6.0 and GTK 4 development files, which the GNOME SDK has
# (Fedora: webkitgtk6.0-devel). The main app does not link WebKit; it starts
# this program only while signing in.
[dependencies]
webkit6 = "0.6"
# webkit6 0.6.1 names gtk::Accessible, which gtk4 0.11 only has with `v4_10`,
# but does not turn that feature on itself. GNOME 50 ships GTK 4.22.
gtk4 = { version = "0.11", features = ["v4_10"] }
